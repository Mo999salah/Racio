services:
  postgres:
    image: postgres:16-alpine
    command: ['postgres', '-c', 'max_connections=200']
    environment:
      POSTGRES_DB: racio
      POSTGRES_USER: racio
      POSTGRES_PASSWORD: racio_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [racio-internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U racio -d racio']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://racio:racio_dev@postgres:5432/racio
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: racio-local-development-secret-change-me-32
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PARSER_URL: http://parser:8001
      LOCAL_STORAGE_PATH: /var/lib/racio/uploads
      NEXT_PUBLIC_DEFAULT_LOCALE: en
      MAX_XLSX_ARCHIVE_BYTES: ${MAX_XLSX_ARCHIVE_BYTES:-20971520}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      EXPORT_SYNC_MAX_ROWS: ${EXPORT_SYNC_MAX_ROWS:-10000}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-250000}
      EXPORT_MAX_FILE_BYTES: ${EXPORT_MAX_FILE_BYTES:-52428800}
      EXPORT_MAX_ARCHIVE_RECORDS: ${EXPORT_MAX_ARCHIVE_RECORDS:-100000}
      EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-24}
      EXPORT_MAX_CONCURRENT_PER_USER: ${EXPORT_MAX_CONCURRENT_PER_USER:-3}
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - racio-private-storage:/var/lib/racio/uploads
    networks:
      - racio-internal
      - racio-public

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://racio:racio_dev@postgres:5432/racio
      PG_BOSS_SCHEMA: pgboss
      PARSER_URL: http://parser:8001
      LOCAL_STORAGE_PATH: /var/lib/racio/uploads
      PARSER_TIMEOUT_MS: ${PARSER_TIMEOUT_MS:-30000}
      EXPORT_SYNC_MAX_ROWS: ${EXPORT_SYNC_MAX_ROWS:-10000}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-250000}
      EXPORT_MAX_FILE_BYTES: ${EXPORT_MAX_FILE_BYTES:-52428800}
      EXPORT_MAX_ARCHIVE_RECORDS: ${EXPORT_MAX_ARCHIVE_RECORDS:-100000}
      EXPORT_RETENTION_HOURS: ${EXPORT_RETENTION_HOURS:-24}
      EXPORT_MAX_CONCURRENT_PER_USER: ${EXPORT_MAX_CONCURRENT_PER_USER:-3}
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_healthy
    volumes:
      - racio-private-storage:/var/lib/racio/uploads
    networks: [racio-internal]

  parser:
    build:
      context: apps/parser
      dockerfile: ../../docker/parser.Dockerfile
    environment:
      PARSER_ENV: development
      PYTHONDONTWRITEBYTECODE: '1'
      MAX_XLSX_ARCHIVE_BYTES: ${MAX_XLSX_ARCHIVE_BYTES:-20971520}
      MAX_XLSX_UNCOMPRESSED_BYTES: ${MAX_XLSX_UNCOMPRESSED_BYTES:-104857600}
      MAX_XLSX_COMPRESSION_RATIO: ${MAX_XLSX_COMPRESSION_RATIO:-100}
      MAX_XLSX_ZIP_ENTRIES: ${MAX_XLSX_ZIP_ENTRIES:-2048}
      MAX_XLSX_SHEETS: ${MAX_XLSX_SHEETS:-32}
      MAX_XLSX_ROWS: ${MAX_XLSX_ROWS:-100000}
      MAX_XLSX_COLUMNS: ${MAX_XLSX_COLUMNS:-256}
      MAX_XLSX_POPULATED_CELLS: ${MAX_XLSX_POPULATED_CELLS:-500000}
      MAX_XLSX_SHARED_STRINGS: ${MAX_XLSX_SHARED_STRINGS:-250000}
      MAX_XLSX_CELL_STRING_LENGTH: ${MAX_XLSX_CELL_STRING_LENGTH:-20000}
      MAX_XLSX_FORMULAS: ${MAX_XLSX_FORMULAS:-10000}
      MAX_XLSX_MERGED_RANGES: ${MAX_XLSX_MERGED_RANGES:-2000}
      MAX_PDF_UPLOAD_BYTES: ${MAX_PDF_UPLOAD_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_PDF_PAGE_DIMENSION_POINTS: ${MAX_PDF_PAGE_DIMENSION_POINTS:-14400}
      MAX_PDF_CHARS_PER_PAGE: ${MAX_PDF_CHARS_PER_PAGE:-200000}
      MAX_PDF_TOTAL_CHARS: ${MAX_PDF_TOTAL_CHARS:-2000000}
      MAX_PDF_WORDS_PER_PAGE: ${MAX_PDF_WORDS_PER_PAGE:-40000}
      MAX_PDF_CANDIDATES: ${MAX_PDF_CANDIDATES:-50000}
      MAX_PDF_STREAM_BYTES: ${MAX_PDF_STREAM_BYTES:-41943040}
      MAX_PDF_OBJECTS: ${MAX_PDF_OBJECTS:-100000}
    expose:
      - '8001'
    read_only: true
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [racio-internal]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  racio-internal:
    internal: true
  racio-public:
    driver: bridge

volumes:
  postgres-data:
  racio-private-storage:

# Development notes:
# - PostgreSQL is intentionally not published to the host. Use `docker compose
#   exec postgres psql ...` when an interactive database session is needed.
# - For hot reload, create a local docker-compose.override.yml (untracked) that
#   mounts source directories and replaces production-like commands.
# - Production deployments must provide secrets through the host/orchestrator,
#   never by editing this file.
