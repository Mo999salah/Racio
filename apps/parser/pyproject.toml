[project]
name = "racio-parser"
version = "0.1.0"
description = "Isolated document parser boundary for Racio"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6.15,<7",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv]
# Security fixes for transitive dependencies (pip-audit gate):
# cryptography is pulled by pdfminer-six (pdfplumber); pin the patched line.
override-dependencies = ["cryptography>=50,<51"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racio_parser"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]
fixtures = [
  "arabic-reshaper>=3.0,<4",
  "python-bidi>=0.6,<1",
  "reportlab>=4.2,<5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
